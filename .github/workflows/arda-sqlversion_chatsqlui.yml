name: Build and deploy Node.js app to Azure Web App - chatsqlui

on:
  push:
    branches:
      - arda/sqlVersion
    paths:
      - "langchain-sql-ui/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: npm install and build
        working-directory: ./langchain-sql-ui
        run: |
          npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./langchain-sql-ui/build/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A05F4673670E4158A1D8F5D602DFA096 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2B31C344B1524894B48EF43AE517CA19 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D13B2105F0BA45F4850D493157B6C98D }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "chatsqlui"
          slot-name: "Production"
          package: . # Subimos el contenido del build descargado

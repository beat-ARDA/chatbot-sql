name: Build and deploy Node.js app to Azure Web App - ardadualsql

on:
  push:
    branches:
      - arda/sqlVersion
    paths:
      - "langchain-sql-api/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: npm install, build, and test
        working-directory: ./langchain-sql-api
        run: |
          npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./langchain-sql-api/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # ELIMINAMOS la sección 'environment' que causaba el error AADSTS700213
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B5A8D0DC0F4C4A058C03DD75DF1A51A8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_24DFB915ABE04BEE8EA4BC1F56AB6013 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_01B21BA59B264CB2B66CD489EE4C0840 }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "ardadualsql"
          slot-name: "Production"
          package: .
